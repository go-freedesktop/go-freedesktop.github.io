baseURL = 'https://go-freedesktop.github.io/'
locale  = 'en-us'
title   = 'go-freedesktop'
# No theme — layouts live in ./layouts

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[params]
  titleSuffix = "pure-Go freedesktop.org specs"
  description = "go-freedesktop is a family of pure-Go (CGO=0) modules implementing the freedesktop.org desktop-integration specs: desktop entries, icon themes, MIME classification and associations, the application menu, and D-Bus notifications."
  brand       = "go-freedesktop"
  github      = "go-freedesktop"
  heroAccent  = "go-freedesktop"
  heroTagline = "The freedesktop.org desktop-integration layer, in pure Go. No cgo, no D-Bus C library, no external tools."

  heroIntro = [
    "<strong>go-freedesktop</strong> is a family of small, independent Go modules that implement the <a href=\"https://www.freedesktop.org/\">freedesktop.org</a> specifications a launcher, file manager or desktop shell relies on &mdash; enumerating installed applications, resolving icons, classifying files by MIME type, choosing which application opens a type, building the category menu, and serving desktop notifications.",
    "Every module is <strong>pure Go, <code>CGO_ENABLED=0</code></strong>, reuses standard XDG base-directory resolution instead of reinventing it, and cross-compiles to a static binary. Each spec is one small module, so a caller pulls in only what it needs. They are the desktop-integration layer beneath <a href=\"https://github.com/go-widgets\">go-widgets</a> launchers and shells."
  ]

[menu]
  [[menu.main]]
    identifier = "why"
    name       = "Why"
    url        = "#why"
    weight     = 10
  [[menu.main]]
    identifier = "repos"
    name       = "Modules"
    url        = "#repos"
    weight     = 20
  [[menu.main]]
    identifier = "quality"
    name       = "Quality"
    url        = "#quality"
    weight     = 30
  [[menu.main]]
    identifier = "docs"
    name       = "Docs"
    url        = "https://go-freedesktop.github.io/docs/"
    weight     = 40
